<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>กาแฟแมวส้ม — Admin</title>
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/orangecatcoffee/orangecat-admin/main/icon-admin.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, "Segoe UI", "Mitr", sans-serif; background: #FFF8F0; color: #4A3428; padding-bottom: 48px; min-height: 100vh; }
  .header { background: linear-gradient(135deg, #FFF3E8, #FFE4CC); padding: 20px 20px 16px; text-align: center; }
  .header .brand { font-size: 12px; color: #A8876F; letter-spacing: 1px; margin-bottom: 2px; }
  .header h1 { font-size: 20px; color: #4A3428; }
  .header .sub { font-size: 12px; color: #E8863A; font-weight: 600; margin-top: 4px; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px; }

  .group { background: #fff; border-radius: 16px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow: hidden; border-left: 5px solid #E0D2C2; }
  .group.audience-customer { border-left-color: #E8863A; }
  .group.audience-owner { border-left-color: #4A7FB5; }
  .audience-tag { font-size: 10px; font-weight: 700; letter-spacing: .3px; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .audience-tag.customer { background: rgba(232,134,58,0.15); color: #C4681E; }
  .audience-tag.owner { background: rgba(74,127,181,0.15); color: #2E5F8F; }
  .group-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; background: #FFF3E8; border-bottom: 1px solid #F0E4D8; }
  .group-title { font-size: 15px; font-weight: 700; color: #4A3428; }

  .item { padding: 14px 16px; border-bottom: 1px solid #F5EDE3; }
  .item:last-child { border-bottom: none; }
  .row-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
  .label { font-size: 13.5px; font-weight: 600; color: #4A3428; }
  .desc { font-size: 11.5px; color: #A8876F; margin-bottom: 10px; line-height: 1.5; }

  .toggle { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; inset: 0; background: #E0D2C2; border-radius: 999px; transition: .2s; }
  .slider:before { content: ""; position: absolute; height: 20px; width: 20px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  input:checked + .slider { background: #4A9B5C; }
  input:checked + .slider:before { transform: translateX(20px); }

  .num-row, .text-row { display: flex; align-items: center; gap: 8px; }
  input[type="number"] { width: 90px; padding: 10px 12px; border-radius: 10px; border: 2px solid #F0E4D8; font-size: 16px; font-family: inherit; color: #4A3428; }
  input[type="text"] { flex: 1; padding: 10px 12px; border-radius: 10px; border: 2px solid #F0E4D8; font-size: 14px; font-family: inherit; color: #4A3428; }
  input:focus { outline: none; border-color: #E8863A; }
  .btn-save { padding: 9px 16px; border-radius: 8px; border: none; background: #E8863A; color: #fff; font-size: 13px; font-weight: 700; font-family: inherit; white-space: nowrap; }
  .btn-save:disabled { background: #D8C4B0; }
  .btn-save.saved { background: #4A9B5C; }

  .loading, .empty { text-align: center; color: #A8876F; font-size: 13px; padding: 30px 0; }
  .footer-note { text-align: center; font-size: 10.5px; color: #C4A98A; margin-top: 24px; line-height: 1.6; }
</style>
</head>
<body>

<div class="header">
  <div class="brand">🐱 กาแฟแมวส้ม</div>
  <h1>Admin</h1>
  <div class="sub">Control Panel — แก้กฎของระบบ</div>
</div>

<div class="wrap" id="app">
  <div class="loading">กำลังโหลด...</div>
</div>

<script>
  const SUPABASE_URL = "https://nhzjnutvirjgiclkkfgx.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oempudXR2aXJqZ2ljbGtrZmd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxMjc3NjEsImV4cCI6MjA5ODcwMzc2MX0.Bv2zsjmo3yd9YpmfxUAmXf-aaFy7SbY77fmM_k4f7eg";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // จัดกลุ่มตามฟีเจอร์จริง (ไม่ใช่ตามประเภท toggle/threshold แบบเดิม) — สวิตช์เปิด/ปิด + ค่าที่เกี่ยวข้องกันอยู่การ์ดเดียวกัน
  // key ที่ไม่ตรงกับกลุ่มไหนเลย จะตกไปกลุ่ม "อื่นๆ" ท้ายสุดอัตโนมัติ กันตกหล่นถ้ามี setting ใหม่ในอนาคต
  const GROUPS = [
    { icon: '☀️', title: 'Daily Brief', audience: 'owner', keys: ['daily_brief.enabled', 'daily_brief.missing_customer_days_min', 'daily_brief.missing_customer_days_max', 'daily_brief.missing_customer_min_cups'] },
    { icon: '💬', title: 'Auto-Feedback', audience: 'customer', keys: ['auto_feedback.enabled', 'auto_feedback.message_template'] },
    { icon: '👋', title: 'Win-back Journey', audience: 'customer', keys: ['crm.winback_enabled', 'crm.winback_days_min', 'crm.winback_days_max', 'crm.winback_min_cups', 'crm.winback_message_template'] },
    { icon: '🎂', title: 'Birthday Journey', audience: 'customer', keys: ['crm.birthday_enabled', 'crm.birthday_reward_text', 'crm.reward_cap_amount', 'crm.birthday_message_template'] },
    { icon: '📝', title: 'GTKY ต้อนรับสมาชิกใหม่', audience: 'customer', keys: ['gtky_welcome.enabled', 'gtky_welcome.category_name'] },
    { icon: '🎟️', title: 'แลกแต้มสะสม 10 แก้ว (Passport)', audience: 'customer', keys: ['passport.redemption_enabled', 'passport.unlock_notify_enabled', 'passport.unlock_message_template', 'passport.show_drink_history'] },
  ];

  async function loadSettings() {
    const app = document.getElementById('app');
    const { data, error } = await sb.from('system_settings').select('*');

    if (error) {
      app.innerHTML = `<div class="empty">โหลดไม่สำเร็จ: ${error.message}</div>`;
      return;
    }
    if (!data || data.length === 0) {
      app.innerHTML = `<div class="empty">ยังไม่มีค่าตั้งค่าในระบบ</div>`;
      return;
    }

    const byKey = {};
    data.forEach(row => { byKey[row.key] = row; });
    const usedKeys = new Set();

    app.innerHTML = '';

    GROUPS.forEach(group => {
      const rows = group.keys.map(k => byKey[k]).filter(Boolean);
      rows.forEach(r => usedKeys.add(r.key));
      if (!rows.length) return; // กลุ่มนี้ยังไม่มี setting ไหนอยู่ในระบบเลย ข้ามไป
      app.appendChild(renderGroup(`${group.icon} ${group.title}`, rows, group.audience));
    });

    // setting ที่เหลือ (ยังไม่ได้จัดกลุ่มไว้) รวมเป็น "อื่นๆ" ท้ายสุด กันตกหล่น
    const leftover = data.filter(row => !usedKeys.has(row.key));
    if (leftover.length) {
      app.appendChild(renderGroup('🔧 อื่นๆ', leftover, null));
    }

    const note = document.createElement('div');
    note.className = 'footer-note';
    note.textContent = 'แก้ตรงนี้มีผลทันที ไม่ต้อง deploy ใหม่ — ถ้าไม่แน่ใจ ปรึกษาก่อนกดบันทึก';
    app.appendChild(note);
  }

  function renderGroup(title, rows, audience) {
    const group = document.createElement('div');
    group.className = 'group' + (audience ? ` audience-${audience}` : '');

    const head = document.createElement('div');
    head.className = 'group-head';
    const titleEl = document.createElement('div');
    titleEl.className = 'group-title';
    titleEl.textContent = title;
    head.appendChild(titleEl);
    if (audience) {
      const tag = document.createElement('span');
      tag.className = `audience-tag ${audience}`;
      tag.textContent = audience === 'customer' ? '📤 ส่งหาลูกค้า' : '📥 แจ้ง Fah เท่านั้น';
      head.appendChild(tag);
    }
    group.appendChild(head);

    rows.forEach(row => group.appendChild(renderItem(row)));
    return group;
  }

  function renderItem(row) {
    const item = document.createElement('div');
    item.className = 'item';

    const top = document.createElement('div');
    top.className = 'row-top';
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = row.label;
    top.appendChild(label);

    if (row.category === 'feature_flag') {
      const toggle = document.createElement('label');
      toggle.className = 'toggle';
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = row.value === true || row.value === 'true';
      const slider = document.createElement('span');
      slider.className = 'slider';
      toggle.appendChild(input);
      toggle.appendChild(slider);
      top.appendChild(toggle);
      // toggle auto-save ทันทีที่กด ไม่ต้องกดปุ่มบันทึกแยก
      input.addEventListener('change', () => saveSetting(row.key, input.checked, null));
    } else {
      top.appendChild(document.createElement('div')); // spacer
    }
    item.appendChild(top);

    if (row.description) {
      const desc = document.createElement('div');
      desc.className = 'desc';
      desc.textContent = row.description;
      item.appendChild(desc);
    }

    if (row.category === 'threshold') {
      const numRow = document.createElement('div');
      numRow.className = 'num-row';
      const input = document.createElement('input');
      input.type = 'number';
      input.value = typeof row.value === 'number' ? row.value : Number(row.value);
      const btn = document.createElement('button');
      btn.className = 'btn-save';
      btn.textContent = 'บันทึก';
      btn.addEventListener('click', () => saveSetting(row.key, Number(input.value), btn));
      numRow.appendChild(input);
      numRow.appendChild(btn);
      item.appendChild(numRow);
    }

    if (row.category === 'text') {
      const textRow = document.createElement('div');
      textRow.className = 'text-row';
      const input = document.createElement('input');
      input.type = 'text';
      input.value = typeof row.value === 'string' ? row.value : (row.value || '');
      input.placeholder = 'พิมพ์ข้อความ...';
      const btn = document.createElement('button');
      btn.className = 'btn-save';
      btn.textContent = 'บันทึก';
      btn.addEventListener('click', () => saveSetting(row.key, input.value, btn));
      textRow.appendChild(input);
      textRow.appendChild(btn);
      item.appendChild(textRow);
    }

    if (row.category === 'message_template') {
      const wrap = document.createElement('div');
      const textarea = document.createElement('textarea');
      textarea.value = typeof row.value === 'string' ? row.value : (row.value || '');
      textarea.rows = 4;
      textarea.style.cssText = 'width:100%;padding:10px 12px;border-radius:10px;border:2px solid #F0E4D8;font-size:13.5px;font-family:inherit;color:#4A3428;resize:vertical;margin-bottom:8px;';
      const btn = document.createElement('button');
      btn.className = 'btn-save';
      btn.textContent = 'บันทึกข้อความ';
      btn.addEventListener('click', () => saveSetting(row.key, textarea.value, btn));
      wrap.appendChild(textarea);
      wrap.appendChild(btn);
      item.appendChild(wrap);
    }

    return item;
  }

  async function saveSetting(key, value, btnEl) {
    if (btnEl) { btnEl.disabled = true; btnEl.textContent = 'กำลังบันทึก...'; }
    const { error } = await sb
      .from('system_settings')
      .update({ value: value, updated_at: new Date().toISOString() })
      .eq('key', key);

    if (error) {
      alert('บันทึกไม่สำเร็จ: ' + error.message);
      if (btnEl) { btnEl.disabled = false; btnEl.textContent = 'บันทึก'; }
      return;
    }
    if (btnEl) {
      btnEl.textContent = '✓ บันทึกแล้ว';
      btnEl.classList.add('saved');
      setTimeout(() => {
        btnEl.textContent = 'บันทึก';
        btnEl.classList.remove('saved');
        btnEl.disabled = false;
      }, 1500);
    }
  }

  loadSettings();
</script>

</body>
</html>
