<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>กาแฟแมวส้ม — Admin</title>
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/orangecatcoffee/orangecat-admin/main/icon-admin.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, "Segoe UI", "Mitr", sans-serif; background: #FFF8F0; color: #4A3428; padding-bottom: 48px; min-height: 100vh; }
  .header { background: linear-gradient(135deg, #FFF3E8, #FFE4CC); padding: 20px 20px 16px; text-align: center; }
  .header .brand { font-size: 12px; color: #A8876F; letter-spacing: 1px; margin-bottom: 2px; }
  .header h1 { font-size: 20px; color: #4A3428; }
  .header .sub { font-size: 12px; color: #E8863A; font-weight: 600; margin-top: 4px; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px; }

  .group { background: #fff; border-radius: 16px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow: hidden; border-left: 5px solid #E0D2C2; }
  .group.audience-customer { border-left-color: #E8863A; }
  .group.audience-owner { border-left-color: #4A7FB5; }
  .audience-tag { font-size: 10px; font-weight: 700; letter-spacing: .3px; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .audience-tag.customer { background: rgba(232,134,58,0.15); color: #C4681E; }
  .audience-tag.owner { background: rgba(74,127,181,0.15); color: #2E5F8F; }
  .group-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; background: #FFF3E8; border-bottom: 1px solid #F0E4D8; }
  .group-title { font-size: 15px; font-weight: 700; color: #4A3428; }

  .item { padding: 14px 16px; border-bottom: 1px solid #F5EDE3; }
  .item:last-child { border-bottom: none; }
  .row-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
  .label { font-size: 13.5px; font-weight: 600; color: #4A3428; }
  .desc { font-size: 11.5px; color: #A8876F; margin-bottom: 10px; line-height: 1.5; }

  .toggle { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; inset: 0; background: #E0D2C2; border-radius: 999px; transition: .2s; }
  .slider:before { content: ""; position: absolute; height: 20px; width: 20px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  input:checked + .slider { background: #4A9B5C; }
  input:checked + .slider:before { transform: translateX(20px); }

  .num-row, .text-row { display: flex; align-items: center; gap: 8px; }
  input[type="number"] { width: 90px; padding: 10px 12px; border-radius: 10px; border: 2px solid #F0E4D8; font-size: 16px; font-family: inherit; color: #4A3428; }
  input[type="text"] { flex: 1; padding: 10px 12px; border-radius: 10px; border: 2px solid #F0E4D8; font-size: 14px; font-family: inherit; color: #4A3428; }
  input:focus { outline: none; border-color: #E8863A; }
  .btn-save { padding: 9px 16px; border-radius: 8px; border: none; background: #E8863A; color: #fff; font-size: 13px; font-weight: 700; font-family: inherit; white-space: nowrap; }
  .btn-save:disabled { background: #D8C4B0; }
  .btn-save.saved { background: #4A9B5C; }

  .loading, .empty { text-align: center; color: #A8876F; font-size: 13px; padding: 30px 0; }
  .footer-note { text-align: center; font-size: 10.5px; color: #C4A98A; margin-top: 24px; line-height: 1.6; }

  /* ---------- TABS (Control Panel | หน้าเมล็ดกาแฟ) ---------- */
  .tabs { display: flex; gap: 6px; max-width: 480px; margin: 0 auto; padding: 12px 16px 0; }
  .tab { flex: 1; padding: 11px 8px; border-radius: 12px 12px 0 0; border: none; background: #F3E7DA; color: #A8876F; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; }
  .tab.on { background: #fff; color: #E8863A; box-shadow: 0 -2px 8px rgba(0,0,0,0.04); }
  .tabs-line { max-width: 480px; margin: 0 auto; height: 3px; background: #fff; }

  /* ---------- BEANS TAB ---------- */
  .bsum { font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin: 4px 0 10px; }
  .bsum label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .bbtn { display: inline-block; padding: 9px 14px; border-radius: 8px; border: 2px solid #E0D2C2; background: #fff; color: #4A3428; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; position: relative; overflow: hidden; }
  .bbtn.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; font-size: 16px; }
  .bprev iframe { width: 100%; height: 640px; border: 2px solid #F0E4D8; border-radius: 12px; background: #C69C6D; }
  .brows { display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; }
  .brow { background: #fff; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-left: 5px solid #4A9B5C; overflow: hidden; }
  .brow.bad { background: #FDE9E6; border-left-color: #E58B84; }
  .brow-head { display: flex; align-items: center; }
  .brow-main { flex: 1; min-width: 0; display: flex; gap: 12px; align-items: center; text-align: left; background: transparent; border: none; padding: 12px; font-family: inherit; color: inherit; cursor: pointer; }
  .bth { flex: 0 0 54px; width: 54px; height: 54px; border-radius: 10px; background: #EADFCF center/cover no-repeat; }
  .bbody { flex: 1; min-width: 0; }
  .bname { font-size: 15px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
  .bmeta { font-size: 11.5px; color: #8A6F5A; margin-top: 3px; line-height: 1.5; }
  .bmiss { color: #B3382C; font-weight: 600; }
  .bok { color: #3F7A5A; }
  .bno { color: #A8876F; }
  .bbd { display: inline-block; font-size: 10.5px; border-radius: 999px; padding: 1px 8px; color: #fff; margin-left: 4px; font-weight: 600; vertical-align: 1px; }
  .bbd.store { background: #E8621A; } .bbd.limited { background: #6E1F2C; } .bbd.house { background: #E8B23A; color: #2a1a05; }
  .bmv { display: flex; flex-direction: column; gap: 4px; padding-right: 10px; }
  .bmv button { width: 32px; height: 28px; border: 1px solid #E0D2C2; background: #fff; border-radius: 6px; cursor: pointer; font-size: 12px; color: #4A3428; }
  .bmv button:disabled { opacity: .3; cursor: default; }
  .bform { padding: 4px 16px 16px; border-top: 1px dashed #E8D8C6; display: flex; flex-direction: column; gap: 12px; }
  .bfield label { display: block; font-size: 12.5px; font-weight: 700; margin: 10px 0 5px; }
  .bfield input[type="text"], .bfield input[type="number"] { width: 100%; padding: 10px 12px; border-radius: 10px; border: 2px solid #F0E4D8; font-size: 16px; font-family: inherit; color: #4A3428; background: #fff; }
  .bfield input.miss { background: #FDE9E6; border-color: #E58B84; }
  .bpic { display: flex; gap: 12px; align-items: center; }
  .bpv { width: 84px; height: 84px; flex: 0 0 84px; border-radius: 10px; background: #EADFCF center/cover no-repeat; border: 2px solid #F0E4D8; }
  .bpic.miss .bpv { background-color: #FDE9E6; border-color: #E58B84; }
  .bpb { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .bopts { display: flex; flex-wrap: wrap; gap: 8px; }
  .bopt { border: 2px solid #E0D2C2; border-radius: 999px; padding: 7px 13px; font-size: 13px; cursor: pointer; background: #fff; user-select: none; }
  .bopt.on { background: #4A3428; color: #FFF8F0; border-color: #4A3428; }
  .bopts.miss .bopt:not(.on) { background: #FDE9E6; border-color: #E58B84; }
  .bhint { font-size: 11.5px; color: #A8876F; margin-top: 5px; line-height: 1.5; }
  .bacts { display: flex; gap: 8px; margin-top: 4px; }
  .bmsg { background: #E9F5EC; border: 1px solid #A9D4B3; color: #2F6B43; border-radius: 10px; padding: 9px 12px; font-size: 13px; margin-bottom: 12px; }
</style>
</head>
<body>

<div class="header">
  <div class="brand">🐱 กาแฟแมวส้ม</div>
  <h1>Admin</h1>
  <div class="sub">Control Panel — แก้กฎของระบบ</div>
  <a href="./logs.html" style="display:inline-block;margin-top:10px;font-size:12px;color:#A8876F;text-decoration:underline;">📋 ดูประวัติการส่งทั้งหมด →</a>
</div>

<div class="tabs" id="tabs">
  <button class="tab on" data-tab="control" type="button">⚙️ Control Panel</button>
  <button class="tab" data-tab="beans" type="button">☕ หน้าเมล็ดกาแฟ</button>
</div>
<div class="tabs-line"></div>

<div id="tabControl">
<div class="wrap">

  <div class="group audience-owner" id="pendingGroup" style="display:none;">
    <div class="group-head">
      <div class="group-title">⏳ รออนุมัติ</div>
      <span class="audience-tag owner">📥 ต้องตัดสินใจ</span>
    </div>
    <div id="pendingList"></div>
  </div>

  <div class="group audience-customer">
    <div class="group-head">
      <div class="group-title">📢 ส่งข้อความหาลูกค้า</div>
      <span class="audience-tag customer">📤 ส่งหาลูกค้า</span>
    </div>
    <div class="item">
      <div class="desc">เลือกกลุ่มเป้าหมาย + พิมพ์ข้อความ แล้วดูรายชื่อก่อนส่งจริงเสมอ — ถ้าเกิน 5 คนจะหยุดรอ approve อัตโนมัติ</div>
      <div style="margin-bottom:10px;">
        <label class="label" style="display:block;margin-bottom:6px;">สั่งสะสมอย่างน้อยกี่แก้ว</label>
        <input type="number" id="bcMinCups" value="2" style="width:100px;">
      </div>
      <div style="margin-bottom:10px;">
        <label class="label" style="display:block;margin-bottom:6px;">สั่งล่าสุดภายในกี่วัน (เว้นว่าง = ไม่จำกัด)</label>
        <input type="number" id="bcMaxDays" placeholder="ไม่จำกัด" style="width:100px;">
      </div>
      <button class="btn-save" id="bcLoadBtn" style="margin-bottom:14px;">โหลดรายชื่อ</button>
      <div id="bcSegmentResult" style="font-size:13px;color:#4A3428;margin-bottom:14px;"></div>
      <div style="margin-bottom:10px;">
        <label class="label" style="display:block;margin-bottom:6px;">ข้อความ (ใช้ {{name}} แทนชื่อลูกค้าได้)</label>
        <textarea id="bcMessage" rows="4" style="width:100%;padding:10px 12px;border-radius:10px;border:2px solid #F0E4D8;font-size:13.5px;font-family:inherit;color:#4A3428;resize:vertical;" placeholder="สวัสดีค่ะ {{name}} ..."></textarea>
      </div>
      <button class="btn-save" id="bcSendBtn" disabled>ส่งเลย</button>
      <div id="bcSendResult" style="font-size:13px;margin-top:10px;"></div>
    </div>
  </div>

  <div id="app">
    <div class="loading">กำลังโหลด...</div>
  </div>
</div>
</div>

<div id="tabBeans" style="display:none;">
  <div class="wrap" id="beansWrap"><div class="loading">กำลังโหลด...</div></div>
</div>

<script>
  const SUPABASE_URL = "https://nhzjnutvirjgiclkkfgx.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oempudXR2aXJqZ2ljbGtrZmd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxMjc3NjEsImV4cCI6MjA5ODcwMzc2MX0.Bv2zsjmo3yd9YpmfxUAmXf-aaFy7SbY77fmM_k4f7eg";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // จัดกลุ่มตามฟีเจอร์จริง (ไม่ใช่ตามประเภท toggle/threshold แบบเดิม) — สวิตช์เปิด/ปิด + ค่าที่เกี่ยวข้องกันอยู่การ์ดเดียวกัน
  // key ที่ไม่ตรงกับกลุ่มไหนเลย จะตกไปกลุ่ม "อื่นๆ" ท้ายสุดอัตโนมัติ กันตกหล่นถ้ามี setting ใหม่ในอนาคต
  const GROUPS = [
    { icon: '☀️', title: 'Daily Brief', audience: 'owner', keys: ['daily_brief.enabled', 'daily_brief.send_hour', 'daily_brief.missing_customer_days_min', 'daily_brief.missing_customer_days_max', 'daily_brief.missing_customer_min_cups'] },
    { icon: '📊', title: 'Weekly Business Review', audience: 'owner', keys: ['weekly_review.enabled'] },
    { icon: '💬', title: 'Auto-Feedback', audience: 'customer', keys: ['auto_feedback.enabled', 'auto_feedback.message_template'] },
    { icon: '👋', title: 'Win-back Journey', audience: 'customer', keys: ['crm.winback_enabled', 'crm.winback_days_min', 'crm.winback_days_max', 'crm.winback_min_cups', 'crm.winback_message_template'] },
    { icon: '🎂', title: 'Birthday Journey', audience: 'customer', keys: ['crm.birthday_enabled', 'crm.birthday_reward_text', 'crm.reward_cap_amount', 'crm.birthday_message_template'] },
    { icon: '📝', title: 'GTKY ต้อนรับสมาชิกใหม่', audience: 'customer', keys: ['gtky_welcome.enabled', 'gtky_welcome.category_name'] },
    { icon: '☕', title: 'แจ้งลูกค้าหลังชง', audience: 'customer', keys: ['brew_notify.enabled', 'brew_notify.message_template'] },
    { icon: '🎟️', title: 'แลกแต้มสะสม 10 แก้ว (Passport)', audience: 'customer', keys: ['passport.redemption_enabled', 'passport.unlock_notify_enabled', 'passport.unlock_message_template', 'passport.show_drink_history'] },
  ];

  async function loadSettings() {
    const app = document.getElementById('app');
    const { data, error } = await sb.from('system_settings').select('*');

    if (error) {
      app.innerHTML = `<div class="empty">โหลดไม่สำเร็จ: ${error.message}</div>`;
      return;
    }
    if (!data || data.length === 0) {
      app.innerHTML = `<div class="empty">ยังไม่มีค่าตั้งค่าในระบบ</div>`;
      return;
    }

    const byKey = {};
    data.forEach(row => { byKey[row.key] = row; });
    const usedKeys = new Set(['beans_page.enabled', 'beans_page.show_cup_price', 'beans_page.ref_menu_1', 'beans_page.ref_menu_2']); // อยู่ในแท็บ หน้าเมล็ดกาแฟ

    app.innerHTML = '';

    GROUPS.forEach(group => {
      const rows = group.keys.map(k => byKey[k]).filter(Boolean);
      rows.forEach(r => usedKeys.add(r.key));
      if (!rows.length) return; // กลุ่มนี้ยังไม่มี setting ไหนอยู่ในระบบเลย ข้ามไป
      app.appendChild(renderGroup(`${group.icon} ${group.title}`, rows, group.audience));
    });

    // setting ที่เหลือ (ยังไม่ได้จัดกลุ่มไว้) รวมเป็น "อื่นๆ" ท้ายสุด กันตกหล่น
    const leftover = data.filter(row => !usedKeys.has(row.key));
    if (leftover.length) {
      app.appendChild(renderGroup('🔧 อื่นๆ', leftover, null));
    }

    const note = document.createElement('div');
    note.className = 'footer-note';
    note.textContent = 'แก้ตรงนี้มีผลทันที ไม่ต้อง deploy ใหม่ — ถ้าไม่แน่ใจ ปรึกษาก่อนกดบันทึก';
    app.appendChild(note);
  }

  function renderGroup(title, rows, audience) {
    const group = document.createElement('div');
    group.className = 'group' + (audience ? ` audience-${audience}` : '');

    const head = document.createElement('div');
    head.className = 'group-head';
    const titleEl = document.createElement('div');
    titleEl.className = 'group-title';
    titleEl.textContent = title;
    head.appendChild(titleEl);
    if (audience) {
      const tag = document.createElement('span');
      tag.className = `audience-tag ${audience}`;
      tag.textContent = audience === 'customer' ? '📤 ส่งหาลูกค้า' : '📥 แจ้ง อาบุ้ง เท่านั้น';
      head.appendChild(tag);
    }
    group.appendChild(head);

    rows.forEach(row => group.appendChild(renderItem(row)));
    return group;
  }

  function renderItem(row) {
    const item = document.createElement('div');
    item.className = 'item';

    const top = document.createElement('div');
    top.className = 'row-top';
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = row.label;
    top.appendChild(label);

    if (row.category === 'feature_flag') {
      const toggle = document.createElement('label');
      toggle.className = 'toggle';
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = row.value === true || row.value === 'true';
      const slider = document.createElement('span');
      slider.className = 'slider';
      toggle.appendChild(input);
      toggle.appendChild(slider);
      top.appendChild(toggle);
      // toggle auto-save ทันทีที่กด ไม่ต้องกดปุ่มบันทึกแยก
      input.addEventListener('change', () => saveSetting(row.key, input.checked, null));
    } else {
      top.appendChild(document.createElement('div')); // spacer
    }
    item.appendChild(top);

    if (row.description) {
      const desc = document.createElement('div');
      desc.className = 'desc';
      desc.textContent = row.description;
      item.appendChild(desc);
    }

    if (row.category === 'threshold') {
      const numRow = document.createElement('div');
      numRow.className = 'num-row';
      const input = document.createElement('input');
      input.type = 'number';
      input.value = typeof row.value === 'number' ? row.value : Number(row.value);
      const btn = document.createElement('button');
      btn.className = 'btn-save';
      btn.textContent = 'บันทึก';
      btn.addEventListener('click', () => saveSetting(row.key, Number(input.value), btn));
      numRow.appendChild(input);
      numRow.appendChild(btn);
      item.appendChild(numRow);
    }

    if (row.category === 'text') {
      const textRow = document.createElement('div');
      textRow.className = 'text-row';
      const input = document.createElement('input');
      input.type = 'text';
      input.value = typeof row.value === 'string' ? row.value : (row.value || '');
      input.placeholder = 'พิมพ์ข้อความ...';
      const btn = document.createElement('button');
      btn.className = 'btn-save';
      btn.textContent = 'บันทึก';
      btn.addEventListener('click', () => saveSetting(row.key, input.value, btn));
      textRow.appendChild(input);
      textRow.appendChild(btn);
      item.appendChild(textRow);
    }

    if (row.category === 'message_template') {
      const wrap = document.createElement('div');
      const textarea = document.createElement('textarea');
      textarea.value = typeof row.value === 'string' ? row.value : (row.value || '');
      textarea.rows = 4;
      textarea.style.cssText = 'width:100%;padding:10px 12px;border-radius:10px;border:2px solid #F0E4D8;font-size:13.5px;font-family:inherit;color:#4A3428;resize:vertical;margin-bottom:8px;';
      const btn = document.createElement('button');
      btn.className = 'btn-save';
      btn.textContent = 'บันทึกข้อความ';
      btn.addEventListener('click', () => saveSetting(row.key, textarea.value, btn));
      wrap.appendChild(textarea);
      wrap.appendChild(btn);
      item.appendChild(wrap);
    }

    return item;
  }

  async function saveSetting(key, value, btnEl) {
    if (btnEl) { btnEl.disabled = true; btnEl.textContent = 'กำลังบันทึก...'; }
    const { error } = await sb
      .from('system_settings')
      .update({ value: value, updated_at: new Date().toISOString() })
      .eq('key', key);

    if (error) {
      alert('บันทึกไม่สำเร็จ: ' + error.message);
      if (btnEl) { btnEl.disabled = false; btnEl.textContent = 'บันทึก'; }
      return;
    }
    if (btnEl) {
      btnEl.textContent = '✓ บันทึกแล้ว';
      btnEl.classList.add('saved');
      setTimeout(() => {
        btnEl.textContent = 'บันทึก';
        btnEl.classList.remove('saved');
        btnEl.disabled = false;
      }, 1500);
    }
  }

  // ---------- PENDING APPROVAL ----------
async function loadPendingApprovals() {
  const { data } = await sb.from('automation_pending_approval').select('*').eq('status', 'pending').order('created_at', { ascending: false });
  const group = document.getElementById('pendingGroup');
  const list = document.getElementById('pendingList');
  if (!data || !data.length) { group.style.display = 'none'; return; }

  group.style.display = 'block';
  list.innerHTML = '';
  const TYPE_LABELS = { winback: '👋 Win-back', birthday: '🎂 Birthday', custom_broadcast: '📢 Broadcast' };

  data.forEach(p => {
    const item = document.createElement('div');
    item.className = 'item';
    const names = (p.candidates || []).map(c => c.customer_name).join(', ');
    item.innerHTML = `
      <div class="label">${TYPE_LABELS[p.automation_type] || p.automation_type} — ${p.candidate_count} คน</div>
      <div class="desc">${names}</div>
      <div class="desc" style="white-space:pre-wrap;background:#FFF8F0;padding:8px;border-radius:8px;margin:8px 0;">${p.message_template}</div>
      <div style="display:flex;gap:8px;">
        <button class="btn-save" data-action="approve" data-id="${p.id}">✅ ส่งเลย</button>

function bMissing(p) {
  if (!p) return ['ยังไม่มีโปรไฟล์'];

}
function bSorted() {
  const rows = bs.items.map(r => Object.assign({}, r, { missing: bMissing(r.p) }));
  rows.sort((a, b) => {
    if (!!a.p !== !!b.p) return a.p ? -1 : 1;
    const sa = a.p ? B_RANK[a.p.status || ''] : 9, sb2 = b.p ? B_RANK[b.p.status || ''] : 9;
    return (sa - sb2) || ((a.p ? a.p.sort_order : 0) - (b.p ? b.p.sort_order : 0)) || String(a.name).localeCompare(String(b.name));

}

function bResizeBlob(file, max) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); c.toBlob(b => b ? res(b) : rej(new Error('แปลงรูปไม่สำเร็จ')), 'image/jpeg', 0.82); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('เปิดรูปไม่ได้')); };
    img.src = url;
  });
}
async function bUploadPhoto(file) {

    if (error) throw error;

}
async function bSave() {
  const d = bs.draft; if (!d) return;
  const clean = x => { const s = String(x == null ? '' : x).trim(); return s || null; };
  const sur = d.surcharge === '' || d.surcharge == null ? 0 : Number(d.surcharge);
  if (!d.blend) {
    if (isNaN(sur) || sur < 0) { alert('ราคาเพิ่มต้องเป็นตัวเลข 0 ขึ้นไป'); return; }
    if (sur !== d.origSurcharge && !confirm(`เปลี่ยนราคาเพิ่มของเมล็ดนี้จาก ${d.origSurcharge}฿ เป็น ${sur}฿ ต่อแก้ว?\nมีผลกับราคาที่ลูกค้าจ่ายในหน้าสั่งทันที`)) return;
  }
  const seen = {}, rec = String(d.recommend || '').split(',').map(x => x.trim()).filter(x => x && !seen[x.toLowerCase()] && (seen[x.toLowerCase()] = 1));
  const row = { photo_url: d.photo_url || null, photo_pos: d.photo_pos || null, roast: clean(d.roast), body: clean(d.body), notes: clean(d.notes), recommend: rec,
    tones: d.tones || [], status: d.status || '', house_pick: !!d.house_pick, visible: !!d.visible, sort_order: Number(d.sort_order) || 0, updated_at: bNow() };
  const q = d.blend ? sb.from('bean_profiles').update(row).eq('id', d.pid) : sb.from('bean_profiles').upsert(Object.assign({ ingredient_id: d.ingId }, row), { onConflict: 'ingredient_id' });
  const { error } = await q;
  if (error) { alert('บันทึกไม่สำเร็จ: ' + error.message); return; }
  if (!d.blend && sur !== d.origSurcharge) {
    const { error: e2 } = await sb.from('ingredients').update({ customer_bean_surcharge: sur, updated_at: bNow() }).eq('id', d.ingId);
    if (e2) alert('บันทึกโปรไฟล์แล้ว แต่แก้ราคาเพิ่มไม่สำเร็จ: ' + e2.message);
  }
  bs.open = null; bs.draft = null; bs.msg = '✓ บันทึกแล้ว';
  await loadBeansTab();
  setTimeout(() => { bs.msg = ''; const m = document.querySelector('.bmsg'); if (m) m.remove(); }, 2200);
}
async function bMove(key, dir) {
  const ordered = bSorted().filter(r => r.p), i = ordered.findIndex(r => r.key === key), j = i + dir;
  if (i < 0 || j < 0 || j >= ordered.length) return;
  const a = ordered[i].p, b = ordered[j].p;
  if ((a.status || '') !== (b.status || '')) return;
  const sa = a.sort_order || 0; let sb2 = b.sort_order || 0;
  if (sa === sb2) sb2 = sa + (dir > 0 ? 1 : -1);
  const r1 = await sb.from('bean_profiles').update({ sort_order: sb2, updated_at: bNow() }).eq('id', a.id);
  const r2 = await sb.from('bean_profiles').update({ sort_order: sa, updated_at: bNow() }).eq('id', b.id);
  if (r1.error || r2.error) alert('จัดลำดับไม่สำเร็จ: ' + (r1.error || r2.error).message);
  await loadBeansTab();
}

document.getElementById('beansWrap').addEventListener('click', e => {
  const t = e.target.closest('[data-bact]'); if (!t) return;
  const a = t.dataset.bact, id = t.dataset.id, v = t.dataset.v, d = bs.draft;
  if (a === 'photo') return;
  if (a === 'onlybad') { bs.onlyBad = t.checked; renderBeansTab(); return; }
  switch (a) {
    case 'toggle': if (bs.open === id) { bs.open = null; bs.draft = null; } else bStartEdit(id); renderBeansTab(); break;
    case 'cancel': bs.open = null; bs.draft = null; renderBeansTab(); break;
    case 'status': d.status = v; renderBeansTab(); break;
    case 'roast': d.roast = d.roast === v ? '' : v; renderBeansTab(); break;
    case 'body': d.body = d.body === v ? '' : v; renderBeansTab(); break;
    case 'vis': d.visible = !d.visible; renderBeansTab(); break;
    case 'tone': { const s = new Set(d.tones || []); if (s.has(v)) s.delete(v); else s.add(v); d.tones = Array.from(s); renderBeansTab(); break; }
    case 'nophoto': d.photo_url = null; renderBeansTab(); break;
    case 'save': bSave(); break;
    case 'up': bMove(id, -1); break;
    case 'down': bMove(id, 1); break;
    case 'preview': bs.previewOpen = !bs.previewOpen; renderBeansTab(); break;
  }
});
document.getElementById('beansWrap').addEventListener('input', e => {
  const f = e.target.dataset && e.target.dataset.bf; if (!f || !bs.draft) return;
  bs.draft[f] = e.target.value;
  if (f === 'notes' || f === 'recommend') e.target.classList.toggle('miss', !e.target.value.trim());
});
document.getElementById('beansWrap').addEventListener('change', e => { if (e.target.dataset && e.target.dataset.bact === 'photo') bUploadPhoto(e.target.files && e.target.files[0]); });

// ---------- tabs ----------
let beansTabLoaded = false;
document.querySelectorAll('#tabs .tab').forEach(btn => btn.addEventListener('click', () => {
  const which = btn.dataset.tab;
  document.querySelectorAll('#tabs .tab').forEach(b => b.classList.toggle('on', b === btn));
  document.getElementById('tabControl').style.display = which === 'control' ? '' : 'none';
  document.getElementById('tabBeans').style.display = which === 'beans' ? '' : 'none';
  if (which === 'beans' && !beansTabLoaded) { beansTabLoaded = true; loadBeansTab(); }
  try { history.replaceState(null, '', which === 'beans' ? '#beans' : location.pathname + location.search); } catch (_) {}
}));
if (location.hash === '#beans') document.querySelector('#tabs .tab[data-tab="beans"]').click();

</script>
